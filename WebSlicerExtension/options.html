<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Web Slicer Options</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px;
        max-width: 600px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Web Slicer</h1>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
    <button id="save">Save</button>
    <div class="status" id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
