<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Web Slicer Options</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px;
        max-width: 600px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .row {
        margin-bottom: 12px;
      }
      .row label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        margin-bottom: 0;
      }
      .row input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      .folder-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .folder-status {
        font-size: 12px;
        color: #555;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Web Slicer</h1>
    <label for="apiBase">API base URL</label>
    <input id="apiBase" type="text" placeholder="http://127.0.0.1:8000">
    <label for="defaultMode">Default mode on toolbar open</label>
    <select id="defaultMode">
      <option value="none">None</option>
      <option value="pick">Pick</option>
      <option value="slice">Slice</option>
    </select>
    <div class="row">
      <label for="doubleClickLibrary">
        <input id="doubleClickLibrary" type="checkbox">
        Double click toolbar icon to open library
      </label>
    </div>
    <div class="row">
      <label for="hotkeySave">
        <input id="hotkeySave" type="checkbox">
        Enable Ctrl+Shift+S to save slices
      </label>
    </div>
    <div class="row">
      <label for="autoSaveOnEnd">
        <input id="autoSaveOnEnd" type="checkbox">
        Save immediately when a slice ends
      </label>
    </div>
    <div class="row">
      <label for="autoSaveMhtml">
        <input id="autoSaveMhtml" type="checkbox">
        Auto-save page captures (MHTML)
      </label>
    </div>
    <div class="row">
      <label>MHTML save folder</label>
      <div class="folder-row">
        <button id="chooseFolder" type="button">Choose folder</button>
        <button id="clearFolder" type="button">Clear</button>
        <span class="folder-status" id="folderStatus">Not set</span>
      </div>
    </div>
    <button id="save">Save</button>
    <div class="status" id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
